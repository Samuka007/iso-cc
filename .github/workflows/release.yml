# 工单 08：tag push → 多发行版发布流水线。
#
# 流程（设计 #4）：tag v* 推送 →
#   checks        flake 门（clippy -D warnings / fmt / nextest，与 ci.yml 同面）
#   packages      musl 静态构建 → nfpm 矩阵出 deb/rpm/apk
#   bundle        packaging/bundle.sh（helper sha256 钉定校验）出 tar.gz
#   pkgbuild-lint namcap 静态检查 PKGBUILD
#   release       汇聚产物 + sha256sums.txt → GitHub Release
#   publish       工单 21：deb → APT registry（aptline composite action，R2 后端；
#                 APTLINE_* secrets 缺失时 skip + ::warning::，job 仍绿）
#
# 版本一致性由 build.rs fail-loud 守卫：tag 基线 != Cargo.toml version 时任何
# cargo 构建即败（checks/packages/bundle 三路都过不了，无需重复脚本）。
# 签名（minisign）后置票，暂以 sha256sums.txt 提供完整性基线。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  MUSL_TARGET: x86_64-unknown-linux-musl

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: clippy + fmt + nextest（flake checks）
        run: nix build -L .#checks.x86_64-linux.clippy .#checks.x86_64-linux.fmt .#checks.x86_64-linux.nextest

  packages:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        packager: [deb, rpm, apk]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: musl 静态构建
        run: nix develop -c cargo build --release --target "$MUSL_TARGET"
      - name: staging 二进制（nfpm contents.src 固定路径）
        run: |
          mkdir -p packaging/dist/pkgroot
          install -m 0755 "target/$MUSL_TARGET/release/iso-cc" packaging/dist/pkgroot/iso-cc
      - name: nfpm 打包（${{ matrix.packager }}）
        run: |
          test -n "${GITHUB_REF_NAME#v}" || { echo "tag 解析失败" >&2; exit 1; }
          VER="${GITHUB_REF_NAME#v}"
          export ISO_CC_NFPM_VERSION="$VER"
          mkdir -p dist
          nix run nixpkgs#nfpm -- package \
            -f packaging/nfpm.yaml \
            -p ${{ matrix.packager }} \
            -t "dist/iso-cc-${VER}-linux-amd64.${{ matrix.packager }}"
      - uses: actions/upload-artifact@v4
        with:
          name: iso-cc-${{ matrix.packager }}
          path: dist/iso-cc-*
          if-no-files-found: error

  bundle:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: bundle tar.gz（helper sha256 钉定校验）
        env:
          ISO_CC_BUNDLE_OUT: dist
        run: nix develop -c packaging/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iso-cc-bundle
          path: dist/iso-cc-bundle-*
          if-no-files-found: error

  pkgbuild-lint:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: PKGBUILD 静态检查（bash -n + shellcheck）
        # namcap 未入 nixpkgs（票 08 验收允许人工对照清单回退）：bash -n 语法 +
        # shellcheck；SC2034/SC2154 = makepkg 魔法变量的必然误报（makepkg 消费
        # pkgname/depends/srcdir/pkgdir 等），其余零告警为门。
        run: |
          bash -n packaging/PKGBUILD
          nix run nixpkgs#shellcheck -- -s bash -S warning packaging/PKGBUILD > /tmp/sc.txt 2>&1 || true
          if grep -oE 'SC[0-9]+' /tmp/sc.txt | sort -u | grep -qvE 'SC2034|SC2154'; then
            cat /tmp/sc.txt
            echo "PKGBUILD lint：存在非 makepkg 上下文误报的告警（fail）" >&2
            exit 1
          fi
          echo "PKGBUILD lint：仅 makepkg 魔法变量误报（SC2034/SC2154），通过"

  release:
    runs-on: ubuntu-latest
    needs: [packages, bundle, pkgbuild-lint]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: sha256sums
        working-directory: dist
        run: sha256sum iso-cc-* > sha256sums.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 安装

          - **发行版原生包**（依赖下放发行版）：deb/rpm/apk；`Depends: passt, slirp4netns`（版本下限见包元数据），`Recommends: tun2proxy`（socks5 形态增强）。
          - **bundle**（零发行版依赖）：`tar xzf iso-cc-bundle-*.tar.gz && cd iso-cc-bundle-*`，运行前 `export ISO_CC_HELPER_DIR=$PWD/libexec`（无 setup、无 PATH 依赖，helper sha256 钉定校验随包构建）。

          ## 完整性

          见 `sha256sums.txt`；签名（minisign）后置票。
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "iso-cc $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/iso-cc-* dist/sha256sums.txt

  publish:
    # deb → APT registry（R2）：apt-ftparchive 索引 + gpg 签名 + rclone 上传。
    # secrets 缺失时 skip（不挡发版）。
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iso-cc-deb
          path: dist
      - name: publish deb → APT registry (R2)
        env:
          APT_ACCOUNT_ID: ${{ secrets.APTLINE_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.APTLINE_R2_ENDPOINT }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.APTLINE_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.APTLINE_R2_SECRET_ACCESS_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.APTLINE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone apt-utils >/dev/null
          [ -z "$APT_ACCOUNT_ID" ] && { echo "::warning::APT registry secrets 未配置，跳过发布"; exit 0; }
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # 增量合并：拉现有 registry（含 passt 组件池）→ 补 pool → 全量重建 → 重签
          rclone copy r2:apt repo --transfers 4
          mkdir -p repo/pool/main/i/iso-cc repo/dists/stable/main/binary-amd64 repo/dists/stable/passt/binary-amd64
          cp dist/iso-cc-*.deb repo/pool/main/i/iso-cc/
          ( cd repo && apt-ftparchive packages pool/main > dists/stable/main/binary-amd64/Packages )
          gzip -9n -k repo/dists/stable/main/binary-amd64/Packages
          # passt 池（来自 passt.yml）如存在则重建其索引
          if [ -d repo/pool/passt ]; then
            ( cd repo && apt-ftparchive packages pool/passt > dists/stable/passt/binary-amd64/Packages )
            gzip -9n -k repo/dists/stable/passt/binary-amd64/Packages
            COMPS="main passt"
          else
            COMPS="main"
          fi
          ( cd repo && apt-ftparchive -o "APT::FTPArchive::Release::Date=$(date -u +'%a, %d %b %Y %H:%M:%S UTC')" \
            -o APT::FTPArchive::Release::Origin=iso-cc \
            -o APT::FTPArchive::Release::Label=iso-cc \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components="$COMPS" \
            -o "APT::FTPArchive::Release::Description=iso-cc APT registry" \
            release dists/stable > dists/stable/Release )
          # keep BOTH Packages and Packages.gz advertised: apt resolves the UNCOMPRESSED
          # MetaKey (main/binary-amd64/Packages) in the Release hash table; gzip-deleting
          # the plain file made apt silently drop the entire repo (root cause of the
          # target-less updates). ftparchive then hashes both entries with correct sums.
          sed -i -E '/ [0-9]+ Release$/d' repo/dists/stable/Release
          gpg --batch --yes --clearsign --output repo/dists/stable/InRelease repo/dists/stable/Release
          gpg --batch --yes --armor --detach-sign --output repo/dists/stable/Release.gpg repo/dists/stable/Release
          rclone copy repo/dists r2:apt/dists --transfers 4
          rclone copy repo/pool r2:apt/pool --transfers 4
